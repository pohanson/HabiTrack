appId: com.habitrack.HabiTrack
# The app should be running and logged in
# This file tests navigation between pages
---
- launchApp
- tapOn: 'Habits'
- assertVisible: Today's Habits
- assertVisible: 'No habits for today.'
- tapOn: 'Milestones'
- assertVisible: 'Milestones'
- assertVisible: 'Ranks'
- tapOn: 'Socials'
- assertVisible: 'Socials'
- assertVisible: 'Your Friends'
- assertVisible: 'Habit Circles'
- tapOn: 'Account'
- assertVisible: 'Account'
- assertVisible: 'Edit Profile'
- assertVisible: 'Log Out'
